[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-melting"
version = "0.2.1"
description = "An extensible AiiDA framework for melting-temperature workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juraj Ovčar" }]
dependencies = ["aiida-core>=2.9,<3"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.9"]

[project.entry-points."aiida.workflows"]
"melting.calculate" = "aiida_melting.workflows.dispatcher:MeltingWorkChain"
"melting.mock" = "aiida_melting.workflows.mock:MockMeltingWorkChain"

[project.entry-points."aiida.cmdline.data"]
melting = "aiida_melting.cli.data:melting"

[project.scripts]
aiida-melting = "aiida_melting.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
